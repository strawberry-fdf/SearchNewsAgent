<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentNews 更新中</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #12121e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                   'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
      /* 允许用户拖动无边框窗口 */
      -webkit-app-region: drag;
      user-select: none;
    }

    .container {
      width: 100%;
      padding: 0 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #73e6b8 0%, #667eea 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status {
      font-size: 0.85rem;
      color: #9ca3af;
      text-align: center;
      min-height: 1.2em;
      transition: color 0.3s;
    }

    .status.done {
      color: #73e6b8;
    }

    .progress-container {
      width: 100%;
      max-width: 280px;
    }

    .progress-bar-bg {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #73e6b8, #667eea);
      transition: width 0.3s ease;
      width: 0%;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.72rem;
      color: #6b7280;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(115, 230, 184, 0.2);
      border-top-color: #73e6b8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="logo">AgentNews</div>
  <div class="spinner" id="spinner"></div>
  <div class="progress-container">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="progress-info">
      <span id="progressPercent">0%</span>
      <span id="progressSize"></span>
    </div>
  </div>
  <div class="status" id="status">正在准备下载更新…</div>
</div>

<script>
  const { ipcRenderer } = require('electron');

  const progressBar = document.getElementById('progressBar');
  const progressPercent = document.getElementById('progressPercent');
  const progressSize = document.getElementById('progressSize');
  const statusEl = document.getElementById('status');
  const spinnerEl = document.getElementById('spinner');

  function formatBytes(bytes) {
    const mb = bytes / (1024 * 1024);
    return mb.toFixed(1) + ' MB';
  }

  // 下载进度
  ipcRenderer.on('update-progress', (_event, data) => {
    const percent = Math.max(0, Math.min(100, Math.round(data.percent)));
    progressBar.style.width = percent + '%';
    progressPercent.textContent = percent + '%';
    if (data.transferred && data.total) {
      progressSize.textContent = formatBytes(data.transferred) + ' / ' + formatBytes(data.total);
    }
    statusEl.textContent = '正在下载更新…';
  });

  // 即将安装
  ipcRenderer.on('update-installing', () => {
    progressBar.style.width = '100%';
    progressPercent.textContent = '100%';
    statusEl.textContent = '下载完成，正在安装更新…';
    statusEl.classList.add('done');
  });
</script>
</body>
</html>
